<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fast Lash 30+</title>
    <link
      rel="preload"
      as="image"
      href="/images/tati-hero.webp"
      imagesrcset="/images/tati-hero-mobile.webp 720w, /images/tati-hero.webp 960w"
      imagesizes="(max-width: 767px) 100vw, 46vw"
      type="image/webp"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://connect.facebook.net" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Meta Pixel Code -->
    <script>
      window.addEventListener('load', function () {
        var loadPixel = function () {
          if (window.fbq) return;
          !function(f,b,e,v,n,t,s)
          {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};
          if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
          n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s)}(window, document,'script',
          'https://connect.facebook.net/en_US/fbevents.js');
          fbq('init', '615875597485992');
          fbq('track', 'PageView');
        };

        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadPixel, { timeout: 3000 });
          return;
        }

        setTimeout(loadPixel, 1500);
      });
    </script>
    <!-- End Meta Pixel Code -->
    <noscript>
      <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=615875597485992&ev=PageView&noscript=1"/>
    </noscript>
  </body>
