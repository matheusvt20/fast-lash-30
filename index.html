<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fast Lash 30+</title>
    <link
      rel="preload"
      as="image"
      href="/images/tati-hero.webp"
      imagesrcset="/images/tati-hero-mobile.webp 720w, /images/tati-hero.webp 960w"
      imagesizes="(max-width: 767px) 100vw, 46vw"
      type="image/webp"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --color-bg: #FAF8F5;
        --color-dark: #1A1A18;
        --color-gold: #C9A96E;
        --color-gold-light: #E8D9C0;
        --color-muted: #7A7870;
        --color-section-alt: #F4F1EC;
        --font-display: 'Playfair Display', serif;
        --font-body: 'DM Sans', sans-serif;
      }
      body {
        background: var(--color-bg);
        color: var(--color-dark);
        font-family: var(--font-body);
      }
      #root { min-height: 100vh; }
      #hero-section { background: #FAF8F5; }
      #hero-section .hero-layout {
        align-items: center;
        box-sizing: border-box;
        display: flex;
        flex-direction: row;
        gap: 60px;
        min-height: 100vh;
        padding: 60px 80px 0;
      }
      #hero-section .hero-copy { flex: 1.1; }
      #hero-section .hero-badge {
        align-items: center;
        background: #F0EAE0;
        border-radius: 100px;
        color: #7A6440;
        display: inline-flex;
        font-size: 13px;
        gap: 6px;
        padding: 6px 16px;
      }
      #hero-section .hero-badge-dot { font-size: 16px; line-height: 1; }
      #hero-section .hero-headline {
        color: #1A1A18;
        font-family: var(--font-display);
        font-size: 54px;
        font-weight: 700;
        line-height: 1.1;
        margin: 20px 0 0;
      }
      #hero-section .hero-subheadline {
        color: #7A7870;
        font-size: 16px;
        line-height: 1.7;
        margin: 16px 0 0;
        max-width: 500px;
      }
      #hero-section .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 36px;
      }
      #hero-section .hero-button {
        align-items: center;
        border-radius: 6px;
        display: inline-flex;
        font-size: 14px;
        font-weight: 500;
        justify-content: center;
        padding: 14px 28px;
        text-align: center;
        text-decoration: none;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }
      #hero-section .hero-button:hover { transform: translateY(-1px); }
      #hero-section .hero-button-primary {
        background: #C9A96E;
        border: none;
        color: #1A1A18;
      }
      #hero-section .hero-button-secondary {
        background: transparent;
        border: 1px solid #C9A96E;
        color: #C9A96E;
      }
      #hero-section .hero-media {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 12px;
      }
      #hero-section .hero-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      #hero-section .hero-pill {
        background: #FFFFFF;
        border-radius: 100px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.12);
        color: #1A1A18;
        font-size: 13px;
        font-weight: 500;
        padding: 8px 16px;
        white-space: nowrap;
      }
      #hero-section .hero-image-frame {
        background: rgba(255, 255, 255, 0.68);
        border: 1px solid #D8C8B3;
        border-radius: 24px;
        box-shadow: 0 18px 40px rgba(78, 58, 33, 0.08);
        overflow: hidden;
        padding: 14px;
        position: relative;
      }
      #hero-section .hero-image {
        border-radius: 20px;
        display: block;
        height: 540px;
        object-fit: cover;
        width: 100%;
      }
      #hero-section .hero-card {
        background: linear-gradient(
          to top,
          rgba(20, 18, 15, 0.95) 0%,
          rgba(20, 18, 15, 0.6) 60%,
          transparent 100%
        );
        border-radius: 0 0 20px 20px;
        bottom: 0;
        left: 0;
        padding: 32px 24px 28px;
        position: absolute;
        right: 0;
      }
      #hero-section .hero-card-badge {
        background: #C9A96E;
        border-radius: 100px;
        color: #1A1A18;
        display: inline-block;
        font-size: 11px;
        font-weight: 500;
        padding: 4px 12px;
      }
      #hero-section .hero-card-name {
        color: #FFFFFF;
        font-family: var(--font-display);
        font-size: 26px;
        font-weight: 700;
        margin: 8px 0 0;
      }
      #hero-section .hero-card-product {
        color: #C9A96E;
        font-size: 13px;
        margin-top: 2px;
      }
      #hero-section .hero-card-copy {
        color: rgba(255,255,255,0.6);
        font-size: 12px;
        margin-top: 6px;
      }
      @media (max-width: 767px) {
        #hero-section .hero-layout {
          flex-direction: column;
          gap: 28px;
          min-height: auto;
          padding: 32px 24px 0;
        }
        #hero-section .hero-copy,
        #hero-section .hero-media { width: 100%; }
        #hero-section .hero-headline { font-size: 40px; }
        #hero-section .hero-actions { flex-direction: column; }
        #hero-section .hero-button { width: 100%; }
        #hero-section .hero-image { height: 380px; }
        #hero-section .hero-card { padding: 24px 20px 22px; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://connect.facebook.net" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/non-critical.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/styles/non-critical.css"></noscript>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
